<?xml version="1.0" encoding="UTF-8"?>
<svg width="1400" height="700" viewBox="0 0 1400 700" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="g1" x1="0" x2="1">
      <stop offset="0%" stop-color="#2b014b"/>
      <stop offset="100%" stop-color="#3a0b5a"/>
    </linearGradient>
    <style>
      .bg { fill: url(#g1); }
      .frame { fill: none; stroke: #d9a6ff; stroke-width:2; rx:12; }
      .title { fill: #fff; font-family: Arial, Helvetica, sans-serif; font-weight:700; font-size:24px }
      .subtitle { fill:#ffd6ff; font-family: Arial; font-size:14px }
      .box { fill:#3a154a; stroke:#c88cff; stroke-width:2; rx:8 }
      .text { fill:#fff; font-family: Arial; font-size:13px }
      .small { fill:#ffd6ff; font-family: Arial; font-size:11px }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1400" height="700" rx="8"/>

  <!-- Header -->
  <rect x="200" y="18" width="1000" height="48" class="frame"/>
  <text x="900" y="48" class="title" text-anchor="middle">PURPLELENS AI SOC ASSISTANT</text>
  <rect x="540" y="70" width="320" height="28" class="frame"/>
  <text x="700" y="90" class="subtitle" text-anchor="middle">Multi-Source Cloud & Host Analysis</text>

  <!-- Input Layer -->
  <rect x="60" y="120" width="1280" height="100" class="frame"/>
  <text x="700" y="140" class="subtitle" text-anchor="middle">INPUT LAYER (Data Preparation)</text>

  <!-- Source boxes -->
  <g>
    <rect x="120" y="160" width="220" height="56" class="box"/>
    <text x="230" y="190" class="text" text-anchor="middle">EVTX (.evtx)\n(Windows)</text>

    <rect x="590" y="160" width="220" height="56" class="box"/>
    <text x="700" y="178" class="text" text-anchor="middle">AWS CloudTrail JSON\n(data/aws_demo.jsonl)</text>

    <rect x="1060" y="160" width="220" height="56" class="box"/>
    <text x="1170" y="178" class="text" text-anchor="middle">GCP Audit Logs (JSON/JSONL)\n(data/gcp_log_pack/*.json)</text>

    <!-- arrows to normalized box -->
    <path d="M230 216 L350 260" stroke="#c88cff" stroke-width="2" fill="none"/>
    <path d="M700 216 L700 260" stroke="#c88cff" stroke-width="2" fill="none"/>
    <path d="M1170 216 L1030 260" stroke="#c88cff" stroke-width="2" fill="none"/>
  </g>

  <!-- Normalized JSONL box -->
  <rect x="320" y="250" width="760" height="54" class="box"/>
  <text x="700" y="280" class="text" text-anchor="middle">Normalized JSONL events (text-based, provenance)\nFields: source_file, record_index, insertId/event_id, protoPayload · Enrichment: actor_kind, automation_tool, cross_project</text>

  <!-- Application layer -->
  <rect x="40" y="330" width="1320" height="230" class="frame"/>
  <text x="700" y="354" class="subtitle" text-anchor="middle">APPLICATION LAYER (Python 3.13.x)</text>

  <!-- Phases -->
  <g>
    <rect x="80" y="380" width="200" height="120" class="box"/>
    <text x="180" y="405" class="text">PHASE 1: INGEST /\nEnrichment\n(src/ingest_*.py)</text>

    <rect x="320" y="380" width="250" height="120" class="box"/>
    <text x="445" y="405" class="text">PHASE 2: ANALYZE\n(LLM + Deterministic)\n(src/llm_analyze.py)</text>

    <rect x="600" y="380" width="200" height="120" class="box"/>
    <text x="700" y="405" class="text">PHASE 3: VALIDATE\n(src/schemas.py, security.py)</text>

    <rect x="840" y="380" width="200" height="120" class="box"/>
    <text x="940" y="405" class="text">PHASE 4: REPORT\n(src/report.py)</text>

    <rect x="1080" y="380" width="200" height="120" class="box"/>
    <text x="1180" y="405" class="text">PHASE 5: PERSIST /\nOUTPUT\n(src/storage.py)</text>

    <!-- arrows between phases -->
    <path d="M280 420 L320 420" stroke="#c88cff" stroke-width="2" fill="none" marker-end="url(#m)"/>
    <path d="M570 420 L600 420" stroke="#c88cff" stroke-width="2" fill="none"/>
    <path d="M800 420 L840 420" stroke="#c88cff" stroke-width="2" fill="none"/>
    <path d="M1040 420 L1080 420" stroke="#c88cff" stroke-width="2" fill="none"/>
  </g>

  <!-- Reporting / Storage -->
  <rect x="60" y="620" width="600" height="60" class="frame"/>
  <text x="360" y="655" class="small">REPORTING / OUTPUT LAYER · Executive Summary · Prioritized Findings · IOCs · Recommendations</text>

  <rect x="740" y="620" width="600" height="60" class="frame"/>
  <text x="1040" y="655" class="small">STORAGE / DEPENDENCIES · SQLite DB (db/analysis.db) · reports/analysis_&lt;UUID&gt;.txt · OpenAI API, Pydantic</text>

  <!-- footer note -->
  <text x="1100" y="690" class="small">See docs/ARCHITECTURE.md for details</text>
</svg>
